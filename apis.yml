aid: cape-analytics
name: Cape Analytics
description: >-
  Cape Analytics (now part of Moody's) is a geospatial property intelligence
  provider that applies computer vision and machine learning to high-resolution
  aerial and satellite imagery, property records, and other novel data sources to
  produce inspection-quality condition and characteristic data for over 100 million
  residential and commercial structures across the United States and Canada. Its
  insights — roof condition and material, swimming pools, solar panels, accessory
  structures, tree overhang, wildfire and wind exposure, distance to hazards, and a
  proprietary Liquidity Score — are delivered to insurance underwriters, lenders,
  and real estate investors in under two seconds via API, batch/bulk files, an
  Automated Property Condition Report (aPCR), and a customer web portal, as well as
  through third-party platforms such as Guidewire and Duck Creek. Cape does not
  publish a public, self-service developer portal or open API specification; API
  access is provisioned to customers and partners through a gated onboarding flow.
